<!-- start custom head snippets -->
<meta http-equiv="Content-Language" content="{{ site.lang | default: 'en' }}">
<meta name="language" content="{{ site.lang | default: 'en' }}">

<script>
(function () {
  function lockBrand() {
    var el = document.querySelector('.project-name');
    if (!el) return;

    // Mark as notranslate (best effort for browser translators)
    el.setAttribute('translate', 'no');
    el.classList.add('notranslate');

    // Force the brand text to be exactly the brand name
    var brand = 'Bags Shield Security';
    if (el.textContent.trim() !== brand) {
      el.textContent = '';
      var s = document.createElement('span');
      s.setAttribute('translate', 'no');
      s.className = 'notranslate';
      s.textContent = brand;
      el.appendChild(s);
    }
  }

  // Run ASAP + after load (covers both fast/slow loads)
  lockBrand();
  document.addEventListener('DOMContentLoaded', lockBrand);
  window.addEventListener('load', lockBrand);
})();
</script>

<style>
/* Keep Cayman styling while preventing translation quirks */
.project-name .notranslate { color: inherit; }
</style>
<!-- end custom head snippets -->
