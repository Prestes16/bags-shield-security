<!-- start custom head snippets -->
<meta http-equiv="Content-Language" content="{{ page.lang | default: site.lang | default: 'en' }}">
<meta name="language" content="{{ page.lang | default: site.lang | default: 'en' }}">

<script>
document.addEventListener('DOMContentLoaded', function () {
  var lang = ({{ page.lang | default: site.lang | default: 'en' | jsonify }} || 'en').toLowerCase();
  var isPT = lang.startsWith('pt');

  // Prevent brand auto-translation in the header
  var nameEl = document.querySelector('.project-name'); // Cayman title
  if (nameEl) {
    nameEl.setAttribute('translate', 'no');
    nameEl.classList.add('notranslate');
  }

  // PT pages: localize Cayman hardcoded strings + tagline
  if (isPT) {
    // Button label
    var btn = document.querySelector('.page-header .btn');
    if (btn && /view on github/i.test(btn.textContent || '')) {
      btn.textContent = 'Ver no GitHub';
    }

    // Footer credits
    var credits = document.querySelector('.site-footer-credits');
    if (credits && /generated by github pages/i.test(credits.textContent || '')) {
      credits.textContent = 'Esta página foi publicada via GitHub Pages.';
    }

    // Tagline (allow per-page override, else default PT line)
    var tagline = {{ page.tagline | default: "" | jsonify }};
    if (!tagline) tagline = 'Pesquisa de segurança baseada em evidências, endurecimento e revisão de PRs (EN/PT)';
    var tagEl = document.querySelector('.project-tagline');
    if (tagEl) tagEl.textContent = tagline;
  }
});
</script>
<!-- end custom head snippets -->
